name: Corpus

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  jdk:
    name: JDK classes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.8"

      - name: Extract JDK classes
        run: '"$JAVA_HOME/bin/jimage" extract --dir "$RUNNER_TEMP/jdk" "$JAVA_HOME/lib/modules"'

      - name: Parse every JDK class
        env:
          CLASSFILEPARSER_CORPUS: ${{ runner.temp }}/jdk
        run: go test -run TestCorpus -v .
